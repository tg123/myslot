message Charactor {
	repeated Slot slot = 1;

	repeated Bind bind = 2;

	repeated Macro macro = 3;

	repeated Slot petslot = 4;

	optional string cooldownManager = 5;

	repeated ClickBinding clickBinding = 6;

	repeated CVar cvar = 7;

	optional uint32 ver = 14;
	optional string name = 15;
}

message CVar {
	optional string name = 1;
	optional string value = 2;
}

message ClickBinding {
	required uint32 type = 1;
	required uint32 actionID = 2;
	optional string button = 3;
	optional uint32 modifiers = 4;
}


message Slot {
	required uint32 id = 1;

	enum SlotType {
		SPELL = 1;
		ITEM = 2;
		MACRO = 3;
		FLYOUT = 4;
		EMPTY = 5;
		EQUIPMENTSET = 6;
		SUMMONPET = 7;
		COMPANION = 8;
		SUMMONMOUNT = 9;
		OUTFIT = 10;
	}

	required SlotType type = 2;

	required uint32 index = 3;
	optional string strindex = 4;
}

message Macro {
	required string name = 1;
	required string body = 2;
	required uint32 id = 3;
	required string icon = 4;
}

message Bind {
	required uint32 id = 1;

	optional string command = 15;

	optional Key key1 = 2;
	optional Key key2 = 3;

	// keys beyond key1/key2, e.g. gamepad buttons bound alongside keyboard keys
	repeated Key keys = 4;
}

message Key {
	required uint32 key = 1;
	required uint32 mod = 2;

	// bitmask of modifiers: ALT=1, CTRL=2, SHIFT=4, META=8. Preferred over mod when present;
	// mod keeps the legacy code (or CUSTOM) so older versions can still import.
	optional uint32 modmask = 3;

	optional string keycode = 15;
}
